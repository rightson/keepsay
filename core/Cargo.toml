[package]
name = "keepsay-core"
description = "Security-critical core of keepsay: key vault, the single Anthropic client, polish prompts and output guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Allows overriding the API base URL for tests (wiremock). Refused at compile
# time in release builds; CI also checks no release artifact enables it.
test-endpoint = []
# Exposes `vault::mock::MockVault` to integration tests. Refused at compile
# time in release builds, same as `test-endpoint`.
test-support = []
# Local speech-to-text via whisper-rs (builds whisper.cpp; needs cmake and
# clang). Off by default so `cargo test -p keepsay-core` stays fast.
whisper = ["dep:whisper-rs"]

[dependencies]
# TLS: rustls + rustls-platform-verifier (OS trust store) with the ring crypto
# provider; `rustls-no-provider` keeps aws-lc-rs/aws-lc-sys out of the graph
# (docs/changes/0012). The provider must be installed at runtime before any
# reqwest Client is built (see 0012).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
# Direct dependency only to select the ring provider (already transitive via
# reqwest). Default features off: they would re-enable aws-lc-rs.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# FFI to Swift (PROPOSAL §6.1), proc-macro style. MPL-2.0, allowed per crate in
# deny.toml (docs/changes/0012). Default features off: `cargo-metadata`, `cli`,
# `bindgen`, `build` belong to the binding generator, not the library.
uniffi = { version = "0.32.2", default-features = false }
whisper-rs = { version = "0.16.0", default-features = false, optional = true }
zeroize = "1.9.1"

# OSX_10_15: `PasswordOptions::use_protected_keychain`, needed for
# ThisDeviceOnly on macOS (data protection keychain, V6).
# OSX_10_15 enables `PasswordOptions::use_protected_keychain`, which macOS
# needs for ThisDeviceOnly (data protection keychain, V6).
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
whisper-rs = { version = "0.16.0", default-features = false, features = ["metal"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
wiremock = "0.6.5"
