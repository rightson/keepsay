# Model manifest (INV-7). The downloader fetches ONLY the URLs listed here and
# rejects any file whose SHA-256 differs from the value committed below.
# Manually imported model files are checked against the same hashes.
#
# Schema (one [[model]] table per model):
#   id        stable identifier used by settings and download_model(id)
#   name      display name
#   url       immutable URL pinned to a revision (never a moving "main" link)
#   revision  upstream commit / tag the URL is pinned to
#   sha256    lowercase hex SHA-256 of the file, computed by a maintainer
#   size      bytes, for the UI and to abort oversized downloads
#   license   upstream model license
#
# No entries yet. Entries are added in M1 with real hashes, verified by a
# maintainer downloading each file, never copied from a third-party listing.
#
# Example (illustrative only; not a real hash):
# [[model]]
# id       = "whisper-small"
# name     = "Whisper small"
# url      = "https://huggingface.co/<org>/<repo>/resolve/<revision>/<file>.bin"
# revision = "<commit sha>"
# sha256   = "<64 hex chars>"
# size     = 0
# license  = "MIT"

schema_version = 1
