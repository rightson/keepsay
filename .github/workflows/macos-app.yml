name: macOS app

# M2 (docs/changes/0015): Swift packages under apple/, the THREAT_MODEL T7
# scan of the fn event tap, ad-hoc signed Keepsay.app artifacts (with and
# without the core), and the keepsay-core XCFramework for macOS + iOS.
# PROPOSAL §9: read-only token, no secrets, actions pinned to commit SHAs.

on:
  pull_request:
    paths:
      - "apple/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "uniffi-bindgen/**"
      - "rust-toolchain.toml"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "uniffi-bindgen/**"
      - "rust-toolchain.toml"
      - ".github/workflows/macos-app.yml"

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fn-tap-scan:
    # THREAT_MODEL T7: the active CGEventTap is one file that reads only the
    # Z keycode and fn / Shift and touches no file, network, pasteboard or
    # logging API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apple/scripts/check-fn-tap.sh

  swift:
    # Builds and tests the Swift packages without the Rust core
    # (UnavailableCore), then packages an ad-hoc signed Keepsay.app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - name: KeepsayKit tests
        run: swift test --package-path apple/KeepsayKit
      - name: KeepsayKit builds for iOS
        run: |
          xcodebuild build -quiet -scheme KeepsayKit -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios"
        working-directory: apple/KeepsayKit
      - name: KeepsayMac tests
        run: swift test --package-path apple/KeepsayMac
      - name: Package Keepsay.app (ad-hoc, Hardened Runtime)
        run: apple/scripts/build-mac-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepsay-macOS-adhoc-nocore
          path: apple/build/Keepsay-macOS.zip
          if-no-files-found: error
          retention-days: 14

  core-linked:
    # keepsay-core static libraries for macOS (arm64, x86_64), iOS and iOS
    # Simulator, Swift bindings from the workspace tool keepsay-uniffi-bindgen
    # (docs/changes/0018 D-12, 0019), KeepsayCoreFFI.xcframework; then the
    # Swift packages are tested and the app packaged against the real core.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: keepsay-core XCFramework + Swift bindings
        run: apple/scripts/build-core.sh
      - name: Exported FFI symbols are present
        run: |
          for p in macos ios ios-sim; do
            lib="apple/build/core/libs/$p/libkeepsay_core.a"
            lipo -info "$lib"
            nm -g "$lib" 2>/dev/null | grep -q 'uniffi_keepsay_core_fn_func_store_key' \
              || { echo "::error::$lib lacks the UniFFI exports"; exit 1; }
          done
      - name: Bindings expose no key getter (INV-2)
        run: |
          b=apple/KeepsayKit/Sources/KeepsayCoreBindings/keepsay_core.swift
          funcs="$(grep -oE '^public func [A-Za-z`]+' "$b" | grep -v FfiConverter | sed "s/^public func //" | LC_ALL=C sort | tr '\n' ' ')"
          echo "$funcs"
          want='`init` budgetStatus deleteKey downloadModel getSettings hasKey importModel keyFingerprint listModels polish saveSettings setUtcOffset storeKey transcribe uniffiEnsureKeepsayCoreInitialized verifyKey '
          [ "$funcs" = "$want" ] || { echo "::error::generated FFI surface changed: $funcs"; exit 1; }
      - name: KeepsayKit tests (core linked)
        run: swift test --package-path apple/KeepsayKit
      - name: KeepsayKit builds for iOS Simulator and device (core linked)
        run: |
          for dest in 'generic/platform=iOS Simulator' 'generic/platform=iOS'; do
            xcodebuild build -quiet -scheme KeepsayKit -destination "$dest" \
              -derivedDataPath "$RUNNER_TEMP/dd-ios-core"
          done
        working-directory: apple/KeepsayKit
      - name: KeepsayMac tests (core linked)
        run: swift test --package-path apple/KeepsayMac
      - name: Package Keepsay.app (ad-hoc, Hardened Runtime, core linked)
        run: apple/scripts/build-mac-app.sh
      - name: Bundle the XCFramework and bindings for the iOS app
        run: |
          cd apple/build/core
          mkdir -p dist
          cp -R KeepsayCoreFFI.xcframework dist/
          cp bindings/keepsay_core.swift dist/
          ditto -c -k --keepParent dist KeepsayCoreFFI.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KeepsayCoreFFI-xcframework
          path: apple/build/core/KeepsayCoreFFI.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepsay-macOS-adhoc
          path: apple/build/Keepsay-macOS.zip
          if-no-files-found: error
          retention-days: 14
