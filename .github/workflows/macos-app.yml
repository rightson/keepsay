name: macOS app

# M2 (docs/changes/0015): Swift packages under apple/, the THREAT_MODEL T7
# scan of the fn event tap, an ad-hoc signed Keepsay.app artifact, and the
# keepsay-core XCFramework for macOS + iOS once core exports its UniFFI API.
# PROPOSAL §9: read-only token, no secrets, actions pinned to commit SHAs.

on:
  pull_request:
    paths:
      - "apple/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/macos-app.yml"

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fn-tap-scan:
    # THREAT_MODEL T7: the active CGEventTap is one file that reads only the
    # Z keycode and fn / Shift and touches no file, network, pasteboard or
    # logging API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apple/scripts/check-fn-tap.sh

  swift:
    # Builds and tests the Swift packages without the Rust core
    # (UnavailableCore), then packages an ad-hoc signed Keepsay.app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - name: KeepsayKit tests
        run: swift test --package-path apple/KeepsayKit
      - name: KeepsayKit builds for iOS
        run: |
          xcodebuild build -quiet -scheme KeepsayKit -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios"
        working-directory: apple/KeepsayKit
      - name: KeepsayMac tests
        run: swift test --package-path apple/KeepsayMac
      - name: Package Keepsay.app (ad-hoc, Hardened Runtime)
        run: apple/scripts/build-mac-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Keepsay-macOS-adhoc-nocore
          path: apple/build/Keepsay-macOS.zip
          if-no-files-found: error
          retention-days: 14

  core-staticlibs:
    # Cross-compiles keepsay-core as static libraries for macOS (arm64,
    # x86_64), iOS and iOS Simulator with apple/scripts/build-core.sh.
    # Swift binding generation + XCFramework packaging need uniffi's `cli`
    # feature, pending approval (docs/changes/0014 D-12, 0015), so CI runs
    # the script with KEEPSAY_SKIP_BINDGEN=1 until then.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: keepsay-core static libraries (macOS, iOS, iOS Simulator)
        run: apple/scripts/build-core.sh
        env:
          KEEPSAY_SKIP_BINDGEN: "1"
      - name: Exported FFI symbols are present
        run: |
          for p in macos ios ios-sim; do
            lib="apple/build/core/libs/$p/libkeepsay_core.a"
            lipo -info "$lib"
            nm -g "$lib" 2>/dev/null | grep -q 'uniffi_keepsay_core_fn_func_store_key' \
              || { echo "::error::$lib lacks the UniFFI exports"; exit 1; }
          done
