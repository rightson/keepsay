# cargo-deny policy (PROPOSAL §9). Run: cargo deny check

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails CI.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Permissive licenses only, all compatible with the project's Apache-2.0
# license (ADR-8).
# Workspace crates are publish = false and skipped via [licenses.private].
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Per-crate exceptions for whitelisted (§14) dependencies whose license is
# permissive but not in the general allow list (docs/changes/0005). Scoped to
# the named crate only; a new crate under the same license still fails.
[[licenses.exceptions]]
crate = "whisper-rs"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "whisper-rs-sys"
allow = ["Unlicense"]

# Mozilla's root certificate list as data, pulled in by rustls-platform-verifier
# (fallback roots on platforms without a usable OS verifier).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# uniffi (§14, FFI to Swift) is MPL-2.0: file-level copyleft, compatible with
# an Apache-2.0 project as long as uniffi's own files stay MPL. Human-approved
# per crate (docs/changes/0012), not a global allow, so any other MPL crate
# still fails.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crates that would add a network path or a telemetry/HTTP stack outside the
# allowlisted reqwest+rustls (INV-3, INV-6). Extend as needed.
deny = [
    { crate = "openssl", reason = "TLS must be rustls (PROPOSAL §6.3)" },
    { crate = "openssl-sys", reason = "TLS must be rustls (PROPOSAL §6.3)" },
    { crate = "native-tls", reason = "TLS must be rustls (PROPOSAL §6.3)" },
    { crate = "aws-lc-rs", reason = "rustls crypto provider is ring (docs/changes/0012)" },
    { crate = "aws-lc-sys", reason = "rustls crypto provider is ring (docs/changes/0012)" },
    { crate = "sentry", reason = "INV-6: no crash upload" },
    { crate = "opentelemetry", reason = "INV-6: no telemetry" },
    { crate = "ureq", reason = "single HTTP stack: reqwest only" },
    { crate = "curl", reason = "single HTTP stack: reqwest only" },
    { crate = "tauri-plugin-http", reason = "lets JS make network requests (PROPOSAL §7.3)" },
    { crate = "tauri-plugin-shell", reason = "PROPOSAL §7.3" },
    { crate = "tauri-plugin-fs", reason = "PROPOSAL §7.3" },
    { crate = "tauri-plugin-updater", reason = "ADR-5: no auto-update" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
