[workspace]
resolver = "3"
members = ["core", "cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/rightson/keepsay"
publish = false

[workspace.lints.rust]
# "deny", not "forbid": forbid cannot be relaxed locally, and exactly one file
# (core/src/vault/windows.rs, Win32 Credential Manager FFI) opts out with an
# inner allow attribute. CI rejects that attribute anywhere else
# (docs/changes/0005).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
