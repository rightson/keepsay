[package]
name = "keepsay-cli"
description = "Developer tool for keepsay: wav file -> transcript -> polish."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keepsay-cli"
path = "src/main.rs"

[features]
# The CLI's whole point is wav -> transcript, so STT is on by default.
# `--no-default-features` builds without whisper.cpp (no cmake/clang needed).
default = ["whisper"]
whisper = ["keepsay-core/whisper"]
# Lets `KEEPSAY_DEV_API_ENDPOINT` point the client at a loopback wiremock
# server for `cli/tests/cli_api.rs`. Debug builds only: keepsay-core refuses
# `test-endpoint` in release builds at compile time.
test-endpoint = ["keepsay-core/test-endpoint"]

[dependencies]
keepsay-core = { path = "../core" }
secrecy = "0.10.3"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wiremock = "0.6.5"
